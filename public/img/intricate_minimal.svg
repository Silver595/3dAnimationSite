<svg
  width="400"
  height="400"
  viewBox="0 0 400 400"
  xmlns="http://www.w3.org/2000/svg"
>
  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="0.8"
    stroke-linecap="round"
    opacity="0.75"
  >

    <!-- Outer geometry -->
    <circle cx="200" cy="200" r="190" />
    <circle cx="200" cy="200" r="150" />

    <!-- Main four circles -->
    <circle cx="200" cy="90" r="58" />
    <circle cx="310" cy="200" r="58" />
    <circle cx="200" cy="310" r="58" />
    <circle cx="90" cy="200" r="58" />

    <!-- Four diagonal circles -->
    <circle cx="122" cy="122" r="34" />
    <circle cx="278" cy="122" r="34" />
    <circle cx="122" cy="278" r="34" />
    <circle cx="278" cy="278" r="34" />

    <!-- Central geometry -->
    <circle cx="200" cy="200" r="42" />
    <circle cx="200" cy="200" r="13" />
    <circle cx="200" cy="200" r="4" />

    <!-- Main vertical curves -->
    <path d="
      M200 0
      C145 65 145 135 200 200
      C255 265 255 335 200 400
    " />

    <path d="
      M200 0
      C255 65 255 135 200 200
      C145 265 145 335 200 400
    " />

    <!-- Main horizontal curves -->
    <path d="
      M0 200
      C65 145 135 145 200 200
      C265 255 335 255 400 200
    " />

    <path d="
      M0 200
      C65 255 135 255 200 200
      C265 145 335 145 400 200
    " />

    <!-- Four large diagonal arcs -->
    <path d="
      M0 0
      C100 0 100 100 200 200
      C300 300 300 400 400 400
    " />

    <path d="
      M400 0
      C300 0 300 100 200 200
      C100 300 100 400 0 400
    " />

    <path d="
      M0 400
      C100 400 100 300 200 200
      C300 100 300 0 400 0
    " />

    <path d="
      M400 400
      C300 400 300 300 200 200
      C100 100 100 0 0 0
    " />

    <!-- Inner diamond -->
    <path d="
      M200 70
      L330 200
      L200 330
      L70 200
      Z
    " />

    <!-- Small cardinal markers -->
    <circle cx="200" cy="70" r="3" />
    <circle cx="330" cy="200" r="3" />
    <circle cx="200" cy="330" r="3" />
    <circle cx="70" cy="200" r="3" />

    <!-- Subtle inner ring -->
    <circle
      cx="200"
      cy="200"
      r="105"
      stroke-dasharray="2 5"
      opacity="0.45"
    />

  </g>
</svg>
