<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="0.8"
    opacity="0.8"
  >

    <!-- Outer frame -->
    <rect x="1" y="1" width="398" height="398"/>

    <!-- Main circles -->
    <circle cx="200" cy="200" r="60"/>
    <circle cx="200" cy="200" r="110"/>
    <circle cx="200" cy="200" r="160"/>
    <circle cx="200" cy="200" r="200"/>

    <!-- Cardinal circles -->
    <circle cx="200" cy="100" r="60"/>
    <circle cx="200" cy="300" r="60"/>
    <circle cx="100" cy="200" r="60"/>
    <circle cx="300" cy="200" r="60"/>

    <!-- Diagonal circles -->
    <circle cx="129" cy="129" r="48"/>
    <circle cx="271" cy="129" r="48"/>
    <circle cx="129" cy="271" r="48"/>
    <circle cx="271" cy="271" r="48"/>

    <!-- Inner cardinal circles -->
    <circle cx="200" cy="100" r="18"/>
    <circle cx="200" cy="300" r="18"/>
    <circle cx="100" cy="200" r="18"/>
    <circle cx="300" cy="200" r="18"/>

    <!-- Center -->
    <circle cx="200" cy="200" r="18"/>
    <circle cx="200" cy="200" r="6"/>

    <!-- Horizontal curved geometry -->
    <path d="
      M0 200
      C60 140 140 140 200 200
      C260 260 340 260 400 200
    "/>

    <path d="
      M0 200
      C60 260 140 260 200 200
      C260 140 340 140 400 200
    "/>

    <!-- Vertical curved geometry -->
    <path d="
      M200 0
      C140 60 140 140 200 200
      C260 260 260 340 200 400
    "/>

    <path d="
      M200 0
      C260 60 260 140 200 200
      C140 260 140 340 200 400
    "/>

    <!-- Large diagonal curves -->
    <path d="
      M0 0
      C100 0 100 100 200 200
      C300 300 300 400 400 400
    "/>

    <path d="
      M400 0
      C300 0 300 100 200 200
      C100 300 100 400 0 400
    "/>

    <path d="
      M0 400
      C100 400 100 300 200 200
      C300 100 300 0 400 0
    "/>

    <path d="
      M400 400
      C300 400 300 300 200 200
      C100 100 100 0 0 0
    "/>

    <!-- Corner arcs -->
    <path d="M0 80 Q80 0 160 0"/>
    <path d="M240 0 Q320 0 400 80"/>

    <path d="M0 320 Q80 400 160 400"/>
    <path d="M240 400 Q320 400 400 320"/>

  </g>
</svg>
