<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="0.8"
    opacity="0.8"
  >

    <!-- Outer frame -->
    <rect x="1" y="1" width="398" height="398"/>

    <!-- Main circles -->
    <circle cx="200" cy="200" r="60"/>
    <circle cx="200" cy="200" r="120"/>
    <circle cx="200" cy="200" r="180"/>
    <circle cx="200" cy="200" r="200"/>

    <!-- Four outer nodes -->
    <circle cx="100" cy="100" r="24"/>
    <circle cx="300" cy="100" r="24"/>
    <circle cx="100" cy="300" r="24"/>
    <circle cx="300" cy="300" r="24"/>

    <!-- Node centers -->
    <circle cx="100" cy="100" r="5"/>
    <circle cx="300" cy="100" r="5"/>
    <circle cx="100" cy="300" r="5"/>
    <circle cx="300" cy="300" r="5"/>

    <!-- Center -->
    <circle cx="200" cy="200" r="24"/>
    <circle cx="200" cy="200" r="7"/>

    <!-- Horizontal wave -->
    <path d="
      M0 200
      C50 100 100 100 200 200
      C300 300 350 300 400 200
    "/>

    <path d="
      M0 200
      C50 300 100 300 200 200
      C300 100 350 100 400 200
    "/>

    <!-- Vertical wave -->
    <path d="
      M200 0
      C100 50 100 100 200 200
      C300 300 300 350 200 400
    "/>

    <path d="
      M200 0
      C300 50 300 100 200 200
      C100 300 100 350 200 400
    "/>

    <!-- Diagonal lattice -->
    <path d="
      M0 0
      C100 50 150 100 200 200
      C250 300 300 350 400 400
    "/>

    <path d="
      M400 0
      C300 50 250 100 200 200
      C150 300 100 350 0 400
    "/>

    <path d="
      M0 400
      C100 350 150 300 200 200
      C250 100 300 50 400 0
    "/>

    <path d="
      M400 400
      C300 350 250 300 200 200
      C150 100 100 50 0 0
    "/>

    <!-- Secondary diagonal curves -->
    <path d="
      M50 0
      C50 100 100 150 200 200
      C300 250 350 300 350 400
    "/>

    <path d="
      M350 0
      C350 100 300 150 200 200
      C100 250 50 300 50 400
    "/>

    <path d="
      M0 50
      C100 50 150 100 200 200
      C250 300 300 350 400 350
    "/>

    <path d="
      M0 350
      C100 350 150 300 200 200
      C250 100 300 50 400 50
    "/>

    <!-- Inner diamonds -->
    <path d="M200 80 L320 200 L200 320 L80 200 Z"/>

    <path d="M200 120 L280 200 L200 280 L120 200 Z"/>

    <!-- Small cardinal nodes -->
    <circle cx="200" cy="80" r="4"/>
    <circle cx="320" cy="200" r="4"/>
    <circle cx="200" cy="320" r="4"/>
    <circle cx="80" cy="200" r="4"/>

    <!-- Corner arcs -->
    <path d="M0 100 Q100 0 200 0"/>
    <path d="M200 0 Q300 0 400 100"/>

    <path d="M0 300 Q100 400 200 400"/>
    <path d="M200 400 Q300 400 400 300"/>

  </g>
</svg>
